  <style>
    /* Viewport Safety */
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Point Square Matrix Loader (3x3 Grid) */
    .point-square-grid {
      display: grid;
      grid-template-columns: repeat(3, 4px);
      grid-gap: 3px;
      width: 18px;
      height: 18px;
      place-items: center;
    }
    .point-square-dot {
      width: 4px;
      height: 4px;
      border-radius: 1px;
      background-color: #D96B47;
      animation: pointPulse 1.2s ease-in-out infinite;
      animation-delay: calc(var(--d) * 0.12s);
    }
    @keyframes pointPulse {
      0%, 100% { opacity: 0.25; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); background-color: #E27D60; }
    }

    /* Animated Micro Download Icon */
    .micro-download-icon .download-arrow {
      transition: transform 0.2s ease;
    }
    .micro-download-animating .download-arrow {
      animation: microArrowBounce 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .micro-download-animating .download-tray {
      animation: microTrayPulse 1s ease-in-out infinite alternate;
    }
    @keyframes microArrowBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(3px); }
    }
    @keyframes microTrayPulse {
      0% { opacity: 0.6; transform: scaleX(0.95); }
      100% { opacity: 1; transform: scaleX(1); }
    }

    /* Markdown Styling */
    .assistant-markdown p { margin-bottom: 0.75rem; line-height: 1.6; }
    .assistant-markdown p:last-child { margin-bottom: 0; }
    .assistant-markdown ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.75rem; }
    .assistant-markdown ol { list-style-type: decimal; margin-left: 1.25rem; margin-bottom: 0.75rem; }
    .assistant-markdown li { margin-bottom: 0.25rem; }
    .assistant-markdown code:not(pre code) {
      font-family: 'JetBrains Mono', monospace;
      padding: 0.15rem 0.35rem;
      border-radius: 0.25rem;
      font-size: 0.85em;
    }
    .dark .assistant-markdown code:not(pre code) {
      background-color: rgba(220, 212, 192, 0.1);
      color: #E27D60;
    }
    html:not(.dark) .assistant-markdown code:not(pre code) {
      background-color: rgba(120, 100, 70, 0.1);
      color: #BF5330;
    }
    .assistant-markdown pre {
      margin: 0.75rem 0;
      border-radius: 0.5rem;
      padding: 0.75rem;
      overflow-x: auto;
    }
    .dark .assistant-markdown pre {
      background-color: #14120D !important;
      border: 1px solid rgba(164, 150, 117, 0.15);
    }
    html:not(.dark) .assistant-markdown pre {
      background-color: #F4EFE6 !important;
      border: 1px solid rgba(82, 72, 54, 0.15);
    }
    .assistant-markdown pre code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      background: transparent !important;
      padding: 0 !important;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(164, 150, 117, 0.2); border-radius: 4px; }
  </style>
</head>

  <!-- Background Web Worker Code for Transformers.js -->
  <script id="worker-script" type="text/javascript-worker">
    import { pipeline, TextStreamer, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.4.0';

    env.useBrowserCache = true;
    let generator = null;
    let currentModelId = null;

    self.onmessage = async (e) => {
      const { type, payload } = e.data;

      if (type === 'load') {
        const { modelId, device } = payload;
        currentModelId = modelId;

        try {
          generator = await pipeline('text-generation', modelId, {
            device: device,
            dtype: 'q4',
            progress_callback: (p) => {
              self.postMessage({ type: 'progress', progress: p });
            }
          });
          self.postMessage({ type: 'loaded', modelId });
        } catch (err) {
          self.postMessage({ type: 'error', error: err.message });
        }
      }

      if (type === 'generate') {
        if (!generator) {
          self.postMessage({ type: 'error', error: 'Model is not loaded yet.' });
          return;
        }

        const { messages, max_new_tokens = 384, temperature = 0.7 } = payload;

        try {
          const streamer = new TextStreamer(generator.tokenizer, {
            skip_prompt: true,
            skip_special_tokens: true,
            callback_function: (chunk) => {
              self.postMessage({ type: 'chunk', chunk });
            }
          });

          await generator(messages, {
            max_new_tokens,
            temperature,
            do_sample: true,
            streamer
          });

          self.postMessage({ type: 'done' });
        } catch (err) {
          self.postMessage({ type: 'error', error: err.message });
        }
      }
    };
  </script>

  <!-- Main Thread Controller -->
  <script type="module">
    // Theme Management
    const htmlEl = document.documentElement;
    const themeToggleBtn = document.getElementById('theme-toggle-btn');
    const themeText = document.getElementById('theme-text');
    
    function updateThemeUI(isDark) {
      if (isDark) {
        htmlEl.classList.add('dark');
        themeText.innerText = "Light Mode";
      } else {
        htmlEl.classList.remove('dark');
        themeText.innerText = "Dark Mode";
      }
    }

    const savedTheme = localStorage.getItem('astra_theme');
    const initialDark = savedTheme ? savedTheme === 'dark' : true;
    updateThemeUI(initialDark);

    themeToggleBtn.addEventListener('click', () => {
      const willBeDark = !htmlEl.classList.contains('dark');
      updateThemeUI(willBeDark);
      localStorage.setItem('astra_theme', willBeDark ? 'dark' : 'light');
    });

    // Settings Modal
    const settingsModal = document.getElementById('settings-modal');
    const openSettingsBtn = document.getElementById('open-settings-btn');
    const closeSettingsBtn = document.getElementById('close-settings-btn');
    const dismissSettingsBtn = document.getElementById('dismiss-settings-btn');

    openSettingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
    closeSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));
    dismissSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));

    document.getElementById('clear-cache-btn').addEventListener('click', async () => {
      if (confirm("Clear downloaded model weights from browser storage?")) {
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const key of keys) await caches.delete(key);
        }
        if (indexedDB && indexedDB.databases) {
          const dbs = await indexedDB.databases();
          for (const db of dbs) indexedDB.deleteDatabase(db.name);
        }
        alert("Cache cleared. Refresh the page to reload.");
        location.reload();
      }
    });

    // DOM References
    const chatScroll = document.getElementById('chat-scroll');
    const welcomeView = document.getElementById('welcome-view');
    const messagesContainer = document.getElementById('messages-container');
    const promptInput = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');
    const statusLight = document.getElementById('status-light');
    const statusText = document.getElementById('status-text');
    const downloadProgressBar = document.getElementById('download-progress-bar');
    const progressFill = document.getElementById('progress-fill');
    const downloadPercent = document.getElementById('download-percent');
    const downloadFileName = document.getElementById('download-file-name');
    const backendLabel = document.getElementById('backend-label');
    const speedMeter = document.getElementById('speed-meter');
    const greetingTitle = document.getElementById('greeting-title');
    const exportChatBtn = document.getElementById('export-chat-btn');

    // Dynamic Diurnal Greeting
    const hour = new Date().getHours();
    if (hour < 12) greetingTitle.innerText = "Good morning. What are you working on?";
    else if (hour < 17) greetingTitle.innerText = "Good afternoon. What are you building?";
    else greetingTitle.innerText = "Good evening. What's on your mind?";

    // Hardware Detection
    let executionDevice = 'wasm';
    if ('gpu' in navigator) {
      try {
        const adapter = await navigator.gpu.requestAdapter();
        if (adapter) {
          executionDevice = 'webgpu';
          backendLabel.innerText = "WebGPU Accelerated";
          backendLabel.className = "text-emerald-500 font-mono text-xs font-medium";
        } else {
          backendLabel.innerText = "WASM CPU (Fallback)";
          backendLabel.className = "text-amber-500 font-mono text-xs font-medium";
        }
      } catch (e) {
        backendLabel.innerText = "WASM CPU (Fallback)";
        backendLabel.className = "text-amber-500 font-mono text-xs font-medium";
      }
    } else {
      backendLabel.innerText = "WASM CPU (Fallback)";
      backendLabel.className = "text-amber-500 font-mono text-xs font-medium";
    }

    // Web Worker Initialization
    const workerBlob = new Blob([document.getElementById('worker-script').textContent], { type: 'application/javascript' });
    const workerUrl = URL.createObjectURL(workerBlob);
    const worker = new Worker(workerUrl, { type: 'module' });

    let isGenerating = false;
    let isModelReady = false;
    let currentModelId = 'onnx-community/Qwen2.5-0.5B-Instruct';

    let currentResponseTarget = null;
    let currentLoader = null;
    let fullResponseAccumulator = "";
    let tokenCounter = 0;
    let generationStartTime = 0;
    let renderScheduled = false;

    // Chat history storage
    let chatMessages = [];

    // Worker Message Listener
    worker.onmessage = (e) => {
      const { type } = e.data;

      if (type === 'progress') {
        const p = e.data.progress;
        if (p.status === 'progress') {
          const pct = Math.round(p.progress || 0);
          progressFill.style.width = `${pct}%`;
          downloadPercent.innerText = `${pct}%`;
          if (p.file) downloadFileName.innerText = `Fetching ${p.file}`;
        } else if (p.status === 'done') {
          downloadFileName.innerText = "Initializing runtime...";
        }
      }

      if (type === 'loaded') {
        isModelReady = true;
        statusLight.className = "w-2 h-2 rounded-full bg-emerald-500";
        statusText.innerText = "Ready";
        downloadProgressBar.classList.add('hidden');
        updateCacheSize();
      }

      if (type === 'chunk') {
        fullResponseAccumulator += e.data.chunk;
        tokenCounter++;
        
        // Throttled UI Render
        if (!renderScheduled) {
          renderScheduled = true;
          requestAnimationFrame(() => {
            if (currentResponseTarget) {
              currentResponseTarget.innerHTML = marked.parse(fullResponseAccumulator);
              const elapsed = (performance.now() - generationStartTime) / 1000;
              if (elapsed > 0) {
                speedMeter.innerText = `${(tokenCounter / elapsed).toFixed(1)} tok/s`;
              }
              chatScroll.scrollTop = chatScroll.scrollHeight;
            }
            renderScheduled = false;
          });
        }
      }

      if (type === 'done') {
        finalizeGeneration();
      }

      if (type === 'error') {
        console.error("Worker error:", e.data.error);
        if (currentResponseTarget) {
          currentResponseTarget.innerHTML += `<p class="text-terracotta-500 font-mono text-xs mt-2">Error: ${e.data.error}</p>`;
        }
        finalizeGeneration();
        statusLight.className = "w-2 h-2 rounded-full bg-red-500";
        statusText.innerText = "Error";
      }
    };

    function finalizeGeneration() {
      isGenerating = false;
      sendBtn.disabled = false;
      statusText.innerText = "Ready";
      if (currentLoader) currentLoader.style.display = 'none';

      if (fullResponseAccumulator) {
        chatMessages.push({ role: 'assistant', content: fullResponseAccumulator });
      }

      if (currentResponseTarget) {
        currentResponseTarget.querySelectorAll('pre code').forEach((block) => {
          hljs.highlightElement(block);
        });
      }
    }

    // Load Model
    function loadModel(modelId) {
      isModelReady = false;
      statusLight.className = "w-2 h-2 rounded-full bg-amber-500 animate-pulse";
      statusText.innerText = "Downloading...";
      downloadProgressBar.classList.remove('hidden');

      worker.postMessage({
        type: 'load',
        payload: { modelId, device: executionDevice }
      });
    }

    // Auto-load on boot
    loadModel(currentModelId);

    // Approximate Cache Storage Size
    async function updateCacheSize() {
      if ('storage' in navigator && 'estimate' in navigator.storage) {
        const est = await navigator.storage.estimate();
        const mb = ((est.usage || 0) / (1024 * 1024)).toFixed(1);
        document.getElementById('cache-usage').innerText = `${mb} MB`;
      }
    }

    // Append Message to UI
    function appendMessage(role, text = "") {
      welcomeView.classList.add('hidden');
      messagesContainer.classList.remove('hidden');

      const msgDiv = document.createElement('div');
      msgDiv.className = `flex flex-col ${role === 'user' ? 'items-end' : 'items-start'} w-full`;

      if (role === 'user') {
        msgDiv.innerHTML = `
          <div class="bg-sand-200/80 dark:bg-sand-900 border border-sand-300/80 dark:border-sand-800 text-sand-900 dark:text-sand-100 px-4 py-2.5 rounded-2xl rounded-tr-sm max-w-[85%] text-sm select-text break-words">
            ${escapeHtml(text)}
          </div>
        `;
      } else {
        msgDiv.innerHTML = `
          <div class="w-full flex items-start gap-3">
            <div class="point-square-grid mt-1 flex-shrink-0" title="Astra Generating">
              <div class="point-square-dot" style="--d:1"></div>
              <div class="point-square-dot" style="--d:2"></div>
              <div class="point-square-dot" style="--d:3"></div>
              <div class="point-square-dot" style="--d:2"></div>
              <div class="point-square-dot" style="--d:3"></div>
              <div class="point-square-dot" style="--d:4"></div>
              <div class="point-square-dot" style="--d:3"></div>
              <div class="point-square-dot" style="--d:4"></div>
              <div class="point-square-dot" style="--d:5"></div>
            </div>
            <div class="flex-1 bg-transparent text-sand-900 dark:text-sand-100 text-sm leading-relaxed assistant-markdown select-text max-w-none break-words">
              ${marked.parse(text)}
            </div>
          </div>
        `;
      }

      messagesContainer.appendChild(msgDiv);
      chatScroll.scrollTop = chatScroll.scrollHeight;
      return msgDiv;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Send Message
    function handleSend() {
      const text = promptInput.value.trim();
      if (!text || isGenerating) return;

      if (!isModelReady) {
        alert("The model weights are downloading. Please allow it to finish.");
        return;
      }

      chatMessages.push({ role: 'user', content: text });
      appendMessage('user', text);
      promptInput.value = '';
      promptInput.style.height = 'auto';

      const assistantDiv = appendMessage('assistant', '');
      currentResponseTarget = assistantDiv.querySelector('.assistant-markdown');
      currentLoader = assistantDiv.querySelector('.point-square-grid');

      isGenerating = true;
      sendBtn.disabled = true;
      statusText.innerText = "Thinking...";

      fullResponseAccumulator = "";
      tokenCounter = 0;
      generationStartTime = performance.now();

      const messages = [
        { role: "system", content: "You are Astra, an articulate and helpful AI assistant running directly on the user's local device." },
        ...chatMessages
      ];

      worker.postMessage({
        type: 'generate',
        payload: {
          messages,
          max_new_tokens: 384,
          temperature: 0.7
        }
      });
    }

    // Export Chat Conversation as Markdown
    exportChatBtn.addEventListener('click', () => {
      if (chatMessages.length === 0) {
        alert("No conversation to export yet.");
        return;
      }
      
      let md = `# Astra AI Conversation\n*Exported on ${new Date().toLocaleString()}*\n\n---\n\n`;
      chatMessages.forEach(msg => {
        md += `### ${msg.role === 'user' ? 'User' : 'Astra'}\n\n${msg.content}\n\n`;
      });

      const blob = new Blob([md], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `astra-chat-${Date.now()}.md`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // Event Bindings
    sendBtn.addEventListener('click', handleSend);
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    promptInput.addEventListener('input', () => {
      promptInput.style.height = 'auto';
      promptInput.style.height = `${Math.min(promptInput.scrollHeight, 120)}px`;
    });

    // Model Selector Dropdown Handlers
    const modelBtn = document.getElementById('model-select-btn');
    const modelDropdown = document.getElementById('model-dropdown');
    modelBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      modelDropdown.classList.toggle('hidden');
    });

    window.addEventListener('click', () => modelDropdown.classList.add('hidden'));

    document.querySelectorAll('.model-opt').forEach(opt => {
      opt.addEventListener('click', () => {
        const id = opt.dataset.id;
        const name = opt.dataset.name;
        if (id === currentModelId) return;

        currentModelId = id;
        document.getElementById('current-model-name').innerText = name;
        modelDropdown.classList.add('hidden');
        loadModel(id);
      });
    });

    // Mobile Sidebar Drawer
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('mobile-backdrop');
    document.getElementById('open-sidebar-btn').addEventListener('click', () => {
      sidebar.classList.remove('-translate-x-full');
      backdrop.classList.remove('hidden');
    });
    const closeSidebar = () => {
      sidebar.classList.add('-translate-x-full');
      backdrop.classList.add('hidden');
    };
    document.getElementById('close-sidebar-btn').addEventListener('click', closeSidebar);
    backdrop.addEventListener('click', closeSidebar);

    // New Session
    document.getElementById('new-chat-btn').addEventListener('click', () => {
      chatMessages = [];
      messagesContainer.innerHTML = '';
      messagesContainer.classList.add('hidden');
      welcomeView.classList.remove('hidden');
      closeSidebar();
    });
    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('new-chat-btn').click();
      }
    });
  </script>
</body>
</html>
